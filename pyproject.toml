[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "software-quality-agent"
version = "0.1.0"
description = "Static software quality workbench and canonical-backend proxy"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "ddgs>=9.16,<10",
    "openai-agents>=0.20,<1.0",
    "procrastinate>=3.10,<4",
    "psycopg[binary]>=3.3,<4",
    "filelock>=3.16,<4",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.0,<6.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
software-quality-agent = "software_quality_agent.cli:main"
software-quality-review-worker = "software_quality_agent.review_jobs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
